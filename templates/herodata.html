<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Data Page</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <a href="/">← Back to list</a>
    {% if hero %}
        <h1>{{ hero.name }}</h1>
        {% if hero.portrait %}
            <img src="{{ hero.portrait }}" alt="{{ hero.name }} portrait">
        {% endif %}
        <p>Role: {{ hero.role }}</p>
    {% else %}
        <p>No hero data available for '{{ hero_key }}'</p>
    {% endif %}
</body>
</html>
